<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Excel Expedition — coming soon." />
    <title>Excel Expedition</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #173326;
        background: #f5f8f3;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }

      main {
        width: min(100%, 680px);
      }

      .logo {
        display: grid;
        grid-template-columns: repeat(3, 8px);
        gap: 4px;
        width: fit-content;
        margin: 0 auto 28px;
        padding: 12px;
        background: #107c41;
        border-radius: 12px;
      }

      .logo span {
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 2px;
      }

      .logo span:nth-child(2),
      .logo span:nth-child(4),
      .logo span:nth-child(9) {
        opacity: 0.5;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 10vw, 76px);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      h1 span {
        color: #107c41;
      }

      p {
        margin: 24px auto 0;
        color: #58675f;
        font-size: clamp(17px, 3vw, 21px);
        line-height: 1.6;
      }

      .status {
        display: inline-block;
        margin-top: 38px;
        padding: 9px 14px;
        color: #107c41;
        background: #e3f1e8;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <h1>Excel <span>Expedition</span></h1>
      <p>A new destination for practical Excel learning is on the way.</p>
      <div class="status">Coming soon</div>
    </main>
  </body>
</html>
